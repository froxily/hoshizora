license_ja = "ライセンスや出典表示の条件は示されていません。"
homepage_url = "https://ssd.jpl.nasa.gov"
cadence_en = "A rolling close-approach window and Sentry, every 12 hours."
cadence_ja = "接近予測とSentryを12時間ごとに更新"
