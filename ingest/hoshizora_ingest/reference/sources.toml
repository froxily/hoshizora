[meta]
source = "Hoshizora curation"
policy = "One entry per registered source. License and credit wording follows each source's published terms, recorded in docs/sources/. update_interval_hours is how often scheduled ingestion refreshes the source; omit it for data that changes only on demand."
retrieved = "2026-10-16"

[sources.launch-library]
name_en = "Launch Library 2 (The Space Devs)"
name_ja = "Launch Library 2（The Space Devs）"
description_en = "Launches, launch vehicles, pads, missions, agencies, and first-stage boosters and landings worldwide."
description_ja = "世界の打ち上げ、ロケット、射場、ミッション、宇宙機関、1段ブースターと着陸のデータです。"
credit_en = "Launch data: The Space Devs, Launch Library 2 (thespacedevs.com)"
credit_ja = "打ち上げデータ：The Space Devs「Launch Library 2」（thespacedevs.com）"
license_en = "No license or attribution requirement is published. Credited as a courtesy."
license_ja = "ライセンスや出典表示の条件は公開されていません。感謝を込めて出典を表示しています。"
homepage_url = "https://thespacedevs.com/llapi"
cadence_en = "Incremental by last change, at most 15 requests per hour."
cadence_ja = "最終更新日時による差分取得（1時間あたり最大15リクエスト）"
update_interval_hours = 1

[sources.celestrak]
name_en = "CelesTrak SATCAT and GP"
name_ja = "CelesTrak（SATCATとGP軌道要素）"
description_en = "Every catalogued object, with its owner, launch and decay dates, and current orbital elements."
description_ja = "カタログに登録されたすべての物体の所有者、打ち上げ日、落下日と最新の軌道要素です。"
credit_en = "Orbital data: CelesTrak (celestrak.org)"
credit_ja = "軌道データ：CelesTrak（celestrak.org）"
license_en = "No attribution requirement is stated. The data is freely available."
license_ja = "出典表示の条件は示されていません。データは自由に利用できます。"
homepage_url = "https://celestrak.org"
cadence_en = "SATCAT at most every 12 hours, active orbital elements at most every 2 hours."
cadence_ja = "SATCATは最短12時間ごと、運用中の軌道要素は最短2時間ごと"
update_interval_hours = 2

[sources.jpl]
name_en = "NASA/JPL Solar System Dynamics"
name_ja = "NASAジェット推進研究所（JPL）Solar System Dynamics"
description_en = "Close approaches of asteroids and comets to Earth, and the Sentry impact-monitoring list."
description_ja = "小惑星や彗星の地球への接近と、衝突監視システムSentryの監視対象です。"
credit_en = "Small-body data: NASA/JPL Solar System Dynamics (SBDB Close Approach and Sentry APIs)"
credit_ja = "小天体データ：NASAジェット推進研究所（JPL）Solar System Dynamics（SBDB Close Approach API、Sentry API）"
