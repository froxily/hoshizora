name: Ingest

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      reviewed:
        description: Resume sources held because their last run needs review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest-all (preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ingest/uv.lock

      - name: Ingest every source, then refresh marts and facts
        working-directory: ingest
        env:
          HOSHIZORA_INGEST_DATABASE_URL: ${{ secrets.PREVIEW_INGEST_DATABASE_URL }}
          HOSHIZORA_LL2_BASE_URL: https://ll.thespacedevs.com
          REVIEWED: ${{ inputs.reviewed }}
        run: |
          if [ "$REVIEWED" = "true" ]; then set -- --reviewed; fi
          uv run --locked --no-dev hoshizora ingest-all --max-wait 120 "$@"
