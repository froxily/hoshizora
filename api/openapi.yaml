      summary: List close approaches
      tags:
      - Near-Earth
  /api/v1/exoplanets:
    get:
      description: "Confirmed exoplanets from the archive's composite table, filtered\
        \ by discovery method, year and distance. Planets whose confirmation has been\
        \ questioned are hidden unless asked for."
      operationId: listExoplanets
      parameters:
      - description: "Discovery method code, e.g. transit, radial_velocity or microlensing."
        in: query
        name: method
        required: false
        schema:
          type: string
          pattern: "[a-z_]{1,40}"
      - description: "First discovery year, inclusive."
        in: query
        name: from_year
        required: false
        schema:
          type: integer
          format: int32
          maximum: 2100
          minimum: 1989
      - description: "Last discovery year, inclusive."
        in: query
        name: to_year
        required: false
        schema:
          type: integer
          format: int32
          maximum: 2100
          minimum: 1989
      - description: Only systems at most this many light-years away.
        in: query
        name: max_distance_ly
        required: false
        schema:
          type: number
          format: double
          exclusiveMinimum: 0
      - description: true to include planets whose confirmation has been questioned.
        in: query
        name: include_controversial
        required: false
        schema:
          type: boolean
          default: false
      - description: "distance (nearest first), -discovery_year, radius or name."
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: distance
          enum:
          - distance
          - -discovery_year
          - radius
          - name
      - description: 1-based page number.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - description: "Items per page, at most 100."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          content:
