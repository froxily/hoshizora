  /api/v1/facts:
    get:
      description: "The highest-scoring facts that are still current, rendered in\
        \ the requested language. Facts below their template's minimum score never\
        \ show. Without module or entity filters the list mixes modules: every module's\
        \ best fact first, then every module's second best, and so on, each round\
        \ best first."
      operationId: listFacts
      parameters:
      - description: "Only facts for this page, e.g. home, launches, near-earth, sun\
          \ or agencies."
        in: query
        name: module
        required: false
        schema:
          type: string
