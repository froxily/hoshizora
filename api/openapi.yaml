            application/json:
              examples:
                seed:
                  value:
                    source: swpc
                    from: 2026-09-17
                    to: 2026-10-17
                    items:
                    - day: 2026-10-14
                      kp_max: 2.67
                      kp_mean: 2.223333333333333
                      intervals: 6
                      g_scale:
                        code: g0
                        name: No geomagnetic storm
                        name_lang: en
                      records_url: /api/v1/space-weather/kp?from=2026-10-14T00:00:00Z&to=2026-10-15T00:00:00Z
                    - day: 2026-10-15
                      kp_max: 3.0
                      kp_mean: 2.16625
                      intervals: 8
                      g_scale:
                        code: g0
                        name: No geomagnetic storm
                        name_lang: en
                      records_url: /api/v1/space-weather/kp?from=2026-10-15T00:00:00Z&to=2026-10-16T00:00:00Z
                    - day: 2026-10-16
                      kp_max: 3.33
                      kp_mean: 2.665
                      intervals: 2
                      g_scale:
                        code: g0
                        name: No geomagnetic storm
                        name_lang: en
                      records_url: /api/v1/space-weather/kp?from=2026-10-16T00:00:00Z&to=2026-10-17T00:00:00Z
              schema:
                $ref: "#/components/schemas/KpDaily"
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Kp per day
      tags:
      - Statistics
components:
  headers:
    CacheControl:
      description: "public, max-age matched to the source's update cadence."
      schema:
        type: string
    ContentLanguage:
      description: "The language the response was localized to: en or ja."
      schema:
        type: string
        enum:
        - en
        - ja
    ETag:
      description: "Strong validator: a hash of this exact response body."
      schema:
        type: string
  parameters:
    AcceptLanguage:
      description: "Language for localized text: en (default) or ja. Region subtags\
        \ and q-values are honored, e.g. ja-JP,ja;q=0.9."
      in: header
      name: Accept-Language
      schema:
        type: string
        default: en
        example: ja
    IfNoneMatch:
      description: An ETag from an earlier response; a match returns 304 with no body.
      in: header
      name: If-None-Match
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: A query or path parameter is invalid.
    InternalError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Unexpected error. No internal details are exposed.
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: No resource exists with this identifier.
    NotModified:
      description: "Not modified: the If-None-Match ETag still matches."
  schemas:
    AgencyCataloguedObjects:
      type: object
      description: Catalogued objects by orbit state.
      properties:
        beyond_earth:
          type: integer
          format: int64
        decayed:
          type: integer
          format: int64
        in_earth_orbit:
          type: integer
          format: int64
        owner_codes:
          type: array
          items:
            type: string
        payloads_in_earth_orbit:
          type: integer
          format: int64
      required:
      - beyond_earth
      - decayed
      - in_earth_orbit
      - owner_codes
      - payloads_in_earth_orbit
    AgencyDetail:
      type: object
      description: "An organization profile: identity, launch record, vehicles, catalogued\
        \ objects and lineage."
      properties:
        abbrev:
          type: string
        catalogued_objects:
          $ref: "#/components/schemas/AgencyCataloguedObjects"
          description: "Objects in the CelesTrak SATCAT owned under its own owner\
            \ codes, such as ESA."
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryRef"
        founding_year:
          type: integer
          format: int32
        key:
          type: string
        launches:
          $ref: "#/components/schemas/LaunchStats"
        lineage:
          type: array
          items:
            $ref: "#/components/schemas/LineageEntry"
        members:
          type: array
          description: Organizations whose parent is this one.
          items:
            $ref: "#/components/schemas/OrganizationRef"
        name:
          type: string
        name_ja_source:
          type: string
          description: "Where the Japanese name was verified: the official Japanese\
            \ site or Japanese Wikipedia."
        name_lang:
          type: string
          enum:
          - en
          - ja
        next_launch:
          $ref: "#/components/schemas/LaunchSummary"
        parent:
          $ref: "#/components/schemas/OrganizationRef"
        partner_missions:
          type: integer
          format: int64
          description: Missions it took part in as a customer or partner.
        programs:
          type: array
          items:
            $ref: "#/components/schemas/ProgramRef"
        recent_launches:
          type: array
          description: "Its latest launch attempts, newest first, at most five."
          items:
            $ref: "#/components/schemas/LaunchSummary"
        reliability:
          $ref: "#/components/schemas/AgencyReliability"
        top_vehicles:
          type: array
          description: "The vehicles it flew most, at most five."
          items:
            $ref: "#/components/schemas/AgencyVehicleUsage"
        type:
          $ref: "#/components/schemas/Term"
      required:
      - countries
      - key
      - lineage
      - members
      - name
      - name_lang
      - partner_missions
      - programs
      - recent_launches
      - top_vehicles
    AgencyReliability:
      type: object
      description: Recent reliability as a launch provider.
      properties:
        current_streak:
          type: integer
          format: int32
          description: Consecutive successes since the latest failure.
        longest_streak:
          type: integer
          format: int32
        recent_attempts:
          type: integer
          format: int32
          description: Completed attempts in the latest window of up to 20.
        recent_success_rate:
          type: number
          format: double
        recent_successes:
          type: integer
          format: int32
      required:
      - current_streak
      - longest_streak
      - recent_attempts
      - recent_successes
    AgencySummary:
      type: object
      description: "An organization with its countries, national programs and launch\
        \ totals."
      properties:
        abbrev:
          type: string
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryRef"
        founding_year:
          type: integer
          format: int32
        key:
          type: string
          description: "Curated slug, or ll2-<Launch Library 2 agency id>."
          example: jaxa
        launches:
          $ref: "#/components/schemas/LaunchStats"
          description: Launches as provider; absent for organizations that never provided
            one.
        name:
          type: string
        name_lang:
          type: string
          enum:
          - en
          - ja
        programs:
          type: array
          items:
            $ref: "#/components/schemas/ProgramRef"
        type:
          $ref: "#/components/schemas/Term"
          description: "agency, company, military, academic or international."
      required:
      - countries
      - key
      - name
      - name_lang
      - programs
    AgencyVehicleUsage:
      type: object
      description: A vehicle and how often this organization flew it.
      properties:
        attempts:
          type: integer
          format: int64
        family:
          type: string
        id:
          type: integer
          format: int32
        name:
          type: string
        name_lang:
          type: string
          enum:
          - en
          - ja
        successes:
          type: integer
          format: int64
      required:
      - attempts
      - id
      - name
      - name_lang
      - successes
    Aurora:
      type: object
      description: "NOAA SWPC's OVATION aurora forecast: the latest probability of\
        \ visible aurora on a 1° grid, and one summary per forecast for the past 48\
        \ hours."
      properties:
        history:
          type: array
          description: "One summary per stored forecast in the 48 hours up to the\
            \ latest, oldest first."
          items:
            $ref: "#/components/schemas/AuroraSummary"
        latest:
          $ref: "#/components/schemas/AuroraForecast"
          description: The latest forecast; absent until one has been ingested.
      required:
      - history
    AuroraForecast:
      type: object
      properties:
        cells:
          type: array
          description: "Cells at or above min_percent as [longitude 0–359 °E, latitude,\
            \ probability %]. Cells below it are omitted."
          items:
            type: array
            items:
              type: integer
              format: int32
        forecast_at:
          type: string
          format: date-time
          description: "The time the forecast is for, usually 30 to 90 minutes later."
        north:
          $ref: "#/components/schemas/AuroraHemisphere"
        observed_at:
          type: string
          format: date-time
          description: When the model ran on the latest solar wind.
        south:
          $ref: "#/components/schemas/AuroraHemisphere"
      required:
      - cells
      - forecast_at
      - north
      - observed_at
      - south
    AuroraHemisphere:
      type: object
      properties:
        boundary_lat:
          type: integer
          format: int32
          description: Latitude closest to the equator where the probability reaches
            10 %.
        max_percent:
          type: integer
          format: int32
          description: "Highest probability of visible aurora anywhere in the hemisphere,\
            \ in percent."
      required:
      - max_percent
    AuroraSummary:
      type: object
      properties:
        north_max_percent:
          type: integer
          format: int32
        observed_at:
          type: string
          format: date-time
        south_max_percent:
          type: integer
          format: int32
      required:
      - north_max_percent
      - observed_at
      - south_max_percent
    CloseApproach:
      type: object
      description: "A close approach of an asteroid or comet to Earth within 0.05\
        \ au, from JPL SBDB."
      properties:
        approach_tdb:
          type: string
          format: tdb-date-time
          description: "Time of closest approach in TDB (Barycentric Dynamical Time),\
            \ as JPL gives it. It has no UTC offset because TDB is not a civil time\
            \ zone."
          example: 2026-10-18T06:16:00
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$"
        approach_utc:
          type: string
          format: date-time
          description: "The same instant in UTC, using IERS leap seconds. Absent before\
            \ 1972."
        body:
          $ref: "#/components/schemas/Term"
          description: The body approached. Currently always Earth.
        designation:
          type: string
          description: JPL primary designation.
          example: 2026 TS
        dist_au:
          type: number
          format: double
          description: Nominal approach distance in astronomical units.
        dist_km:
          type: number
          format: double
        dist_ld:
          type: number
          format: double
          description: "Distance in Earth–Moon distances (1 LD = 384,400 km)."
        dist_max_km:
          type: number
          format: double
          description: Maximum possible distance at 3 sigma.
        dist_min_km:
          type: number
          format: double
          description: Minimum possible distance at 3 sigma.
        fullname:
          type: string
        h_mag:
          type: number
          format: double
          description: "Absolute magnitude H: lower means larger."
        sentry:
          type: boolean
          description: Whether the object is on the active Sentry impact-monitoring
            list.
        size:
          $ref: "#/components/schemas/SmallBodySize"
        time_uncertainty:
          $ref: "#/components/schemas/TimeUncertainty"
        v_inf_kms:
          type: number
          format: double
          description: "Velocity relative to a massless Earth, as if no gravity bent\
            \ the path."
        v_rel_kms:
          type: number
          format: double
          description: Velocity relative to Earth at closest approach.
      required:
      - approach_tdb
      - body
      - designation
      - dist_au
      - dist_km
      - dist_ld
      - sentry
      - size
    CloseApproachMonth:
      type: object
      properties:
        approaches:
          type: integer
          format: int64
        closest_designation:
          type: string
        closest_dist_ld:
          type: number
          format: double
        largest_designation:
          type: string
        min_absolute_magnitude:
          type: number
          format: double
          description: "Lowest absolute magnitude H that month: the likely largest\
            \ object."
        month:
          type: string
          format: date
          description: First day of the month.
        predicted:
          type: boolean
          description: "True when the whole month lies in the future, so every approach\
            \ is predicted."
        records_url:
          type: string
        within_lunar_distance:
          type: integer
          format: int64
          description: "Approaches closer than the Moon (1 LD = 384,400 km)."
      required:
      - approaches
      - closest_designation
      - closest_dist_ld
      - month
      - predicted
      - records_url
      - within_lunar_distance
    CloseApproachMonthly:
      type: object
      description: "Close approaches within 0.05 au of Earth per TDB calendar month,\
        \ past and predicted."
      properties:
        from:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/CloseApproachMonth"
        source:
          type: string
        to:
          type: string
          format: date
      required:
      - from
      - items
      - source
      - to
    CountryRef:
      type: object
      description: "A country or territory, named from Unicode CLDR."
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 code.
          example: JP
        name:
          type: string
      required:
      - code
      - name
    Exoplanet:
      type: object
      description: "A confirmed exoplanet with the NASA Exoplanet Archive's best value\
        \ for each parameter, which may come from different publications."
      properties:
        controversial:
          type: boolean
          description: The planet's confirmation has been questioned in the literature.
        discovery:
          $ref: "#/components/schemas/ExoplanetDiscovery"
        distance_ly:
          type: number
          format: double
          description: Distance in light-years (1 pc = 3.26156 ly).
        distance_pc:
          type: number
          format: double
          description: Distance to the planetary system in parsecs.
        eccentricity:
          type: number
          format: double
        equilibrium_temp_k:
          type: number
          format: double
          description: Modeled equilibrium temperature in kelvin.
        host_name:
          type: string
          description: Host star name.
          example: Proxima Cen
        insolation_earth:
          type: number
          format: double
          description: "Starlight received, relative to what Earth gets from the Sun."
        mass_earth:
          type: number
          format: double
          description: Best available mass in Earth masses; M sin i for most radial-velocity
            planets.
        name:
          type: string
          description: Planet name as most commonly used in the literature.
          example: Proxima Cen b
        orbital_period_days:
          type: number
          format: double
          description: Orbital period in days.
        radius_earth:
          type: number
          format: double
          description: "Radius in Earth radii. Measured for transiting planets, mostly\
            \ estimated otherwise."
        semi_major_axis_au:
          type: number
          format: double
          description: Semi-major axis in astronomical units.
        star:
          $ref: "#/components/schemas/ExoplanetStar"
      required:
      - controversial
      - discovery
      - host_name
      - name
      - star
    ExoplanetDetail:
      type: object
      description: One exoplanet and the archive responses behind its record.
      properties:
        lineage:
          type: array
          items:
            $ref: "#/components/schemas/LineageEntry"
        planet:
          $ref: "#/components/schemas/Exoplanet"
      required:
      - lineage
      - planet
    ExoplanetDiscoveries:
      type: object
      description: "Confirmed exoplanets per discovery year, split by discovery method."
      properties:
        methods:
          type: array
          description: "Every method in the years returned, most planets first."
          items:
            $ref: "#/components/schemas/ExoplanetDiscoveryMethod"
        source:
          type: string
          description: "Source slug, as in /api/v1/meta/sources."
        years:
          type: array
          items:
            $ref: "#/components/schemas/ExoplanetDiscoveryYear"
      required:
      - methods
      - source
      - years
    ExoplanetDiscovery:
      type: object
      properties:
        facility:
          type: string
          description: "Facility behind the discovery observations, e.g. Transiting\
            \ Exoplanet Survey Satellite (TESS)."
        locale:
          type: string
          description: "ground, space or multiple locales."
        method:
          $ref: "#/components/schemas/Term"
          description: "Discovery method, e.g. transit or radial_velocity."
        year:
          type: integer
          format: int32
      required:
      - method
    ExoplanetDiscoveryMethod:
      type: object
      properties:
        method:
          $ref: "#/components/schemas/Term"
        planets:
          type: integer
          format: int64
      required:
      - method
      - planets
    ExoplanetDiscoveryYear:
      type: object
      properties:
        from_space:
          type: integer
          format: int64
          description: Planets found with space telescopes.
        methods:
          type: array
          items:
            $ref: "#/components/schemas/ExoplanetMethodCount"
        planets:
          type: integer
          format: int64
        records_url:
          type: string
          description: The planets behind these numbers.
        year:
          type: integer
          format: int32
      required:
      - from_space
      - methods
      - planets
      - records_url
      - year
    ExoplanetMethodCount:
      type: object
      properties:
        code:
          type: string
          description: "Method code, as in methods[].method.code."
        planets:
          type: integer
          format: int64
      required:
      - code
      - planets
    ExoplanetSizeOrbit:
      type: object
      description: "Transiting exoplanets counted on a logarithmic grid of orbital\
        \ period and radius. Transits measure a planet's radius directly; other methods\
        \ mostly estimate it, so they are left out."
      properties:
        cells:
          type: array
          items:
            $ref: "#/components/schemas/ExoplanetSizeOrbitCell"
        period_step_dex:
          type: number
          format: double
          description: Width of a period cell in powers of ten.
          example: 0.25
        planets:
          type: integer
          format: int64
        radius_step_dex:
          type: number
          format: double
          description: Height of a radius cell in powers of ten.
          example: 0.125
        source:
          type: string
          description: "Source slug, as in /api/v1/meta/sources."
      required:
      - cells
      - period_step_dex
      - planets
      - radius_step_dex
      - source
    ExoplanetSizeOrbitCell:
      type: object
      properties:
        period_max_days:
          type: number
          format: double
          description: "Longest orbital period in the cell, days (exclusive)."
        period_min_days:
          type: number
          format: double
          description: "Shortest orbital period in the cell, days."
        planets:
          type: integer
          format: int64
        radius_max_earth:
          type: number
          format: double
          description: "Largest radius in the cell, Earth radii (exclusive)."
        radius_min_earth:
          type: number
          format: double
          description: "Smallest radius in the cell, Earth radii."
      required:
      - period_max_days
      - period_min_days
      - planets
      - radius_max_earth
      - radius_min_earth
    ExoplanetStar:
      type: object
      description: The host star and its system.
      properties:
        mass_sun:
          type: number
          format: double
          description: Mass in solar masses.
        planet_count:
          type: integer
          format: int32
          description: Confirmed planets in the system.
        radius_sun:
          type: number
          format: double
          description: Radius in solar radii.
        star_count:
          type: integer
          format: int32
          description: Stars in the system.
        temp_k:
          type: number
          format: double
          description: Effective temperature in kelvin.
    Fact:
      type: object
      description: "A fun fact computed from ingested data, or curated with a citation,\
        \ rendered for Accept-Language."
      properties:
        citation_url:
          type: string
          description: "Required for curated facts: where the fact is documented."
        entity:
          $ref: "#/components/schemas/FactEntity"
        generated_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        key:
          type: string
          description: Template key.
          example: near-earth.closest_this_week
        kind:
          $ref: "#/components/schemas/Term"
          description: computed or curated.
        module:
          type: string
          description: "The page it belongs to, e.g. home, launches, near-earth, sun\
            \ or agencies."
        params:
          type: object
          additionalProperties: {}
          description: "The numbers and names in the text, unformatted, so the data\
            \ stays inspectable."
        score:
          type: number
          format: double
          description: How extreme or novel the fact is; higher shows first.
        sources:
          type: array
          description: "The records behind the fact, linked to the API where a route\
            \ exists."
          items:
            $ref: "#/components/schemas/FactReference"
        text:
          type: string
        text_lang:
          type: string
          enum:
          - en
          - ja
        valid_until:
          type: string
          format: date-time
      required:
      - generated_at
      - id
      - key
      - kind
      - module
      - params
      - score
      - sources
      - text
      - text_lang
    FactDetail:
      type: object
      description: "A fact with the source responses behind every record it uses:\
        \ how we know this."
      properties:
        fact:
          $ref: "#/components/schemas/Fact"
        lineage:
          type: array
          items:
            $ref: "#/components/schemas/LineageEntry"
      required:
      - fact
      - lineage
    FactEntity:
      type: object
      description: The record the fact is about.
      properties:
        key:
          type: string
        type:
          type: string
      required:
      - key
      - type
    FactReference:
      type: object
      properties:
        entity:
          type: string
          example: core.close_approach
        key:
          type: string
        records_url:
          type: string
          description: "API route for the record, where one exists."
      required:
      - entity
      - key
    Facts:
      type: object
      description: "The highest-scoring current facts, best first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Fact"
      required:
      - items
    Flare:
      type: object
      description: A solar X-ray flare seen by a GOES satellite in the 0.1–0.8 nm
        band.
      properties:
        begin_at:
          type: string
          format: date-time
        class_letter:
          type: string
          description: "A, B, C, M or X: each letter is ten times the one before."
        end_at:
          type: string
          format: date-time
        id:
          type: string
          description: SWPC event id.
        in_progress:
          type: boolean
          description: True while the flare has no end time yet.
        peak_at:
          type: string
          format: date-time
        peak_flux_wm2:
          type: number
          format: double
          description: Peak X-ray flux in W/m².
        r_scale:
          $ref: "#/components/schemas/Term"
          description: "NOAA radio blackout level, r0 to r5."
        satellite:
          type: integer
          format: int32
          description: GOES satellite number.
        xray_class:
          type: string
          description: GOES class such as M6.4; absent until SWPC classifies the flare.
          example: M6.4
      required:
      - id
      - in_progress
    FlareClassCounts:
      type: object
      properties:
        a:
          type: integer
          format: int64
        b:
          type: integer
          format: int64
        c:
          type: integer
          format: int64
        m:
          type: integer
          format: int64
        x:
          type: integer
          format: int64
      required:
      - a
      - b
      - c
      - m
      - x
    FlareMonth:
      type: object
      properties:
        by_class:
          $ref: "#/components/schemas/FlareClassCounts"
          description: Flares per class letter; each letter is ten times stronger
            than the one before.
        max_peak_flux_wm2:
          type: number
          format: double
        month:
          type: string
          format: date
          description: First day of the month.
        records_url:
