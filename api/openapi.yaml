    Problem:
      type: object
      description: RFC 9457 Problem Details. title and detail are localized by Accept-Language.
      properties:
        code:
          type: string
          enum:
          - invalid_parameter
          - not_found
          - method_not_allowed
          - not_acceptable
          - internal_error
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: "Why the value was rejected, localized."
              parameter:
                type: string
                description: The query or path parameter name.
            required:
            - message
            - parameter
        instance:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          description: Omitted when about:blank.
      required:
      - code
      - status
      - title
    ProgramRef:
      type: object
      description: "A national space program grouping its agencies, companies and\
        \ armed forces."
      properties:
        name:
          type: string
        slug:
          type: string
          example: japan
      required:
      - name
      - slug
    SmallBodySize:
      type: object
      description: "Measured diameter where known, otherwise a range estimated from\
        \ H for an assumed geometric albedo between 0.05 (dark) and 0.25 (bright)."
      properties:
        assumed_albedo_max:
          type: number
          format: double
        assumed_albedo_min:
          type: number
          format: double
        estimated_max_km:
          type: number
          format: double
          description: Diameter if the surface is dark (albedo 0.05).
        estimated_min_km:
          type: number
          format: double
          description: Diameter if the surface is bright (albedo 0.25).
        measured_km:
          type: number
          format: double
        measured_sigma_km:
          type: number
          format: double
      required:
      - assumed_albedo_max
      - assumed_albedo_min
    SolarWind:
      type: object
      description: "Real-time solar wind at the Sun–Earth L1 point, by minute or averaged\
        \ by hour."
      properties:
        from:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/SolarWindPoint"
        resolution:
          type: string
          enum:
          - minute
          - hour
        to:
          type: string
          format: date-time
      required:
      - from
      - items
      - resolution
      - to
    SolarWindPoint:
      type: object
      description: "One minute, or the mean over one UTC hour."
      properties:
        bt_nt:
          type: number
          format: double
          description: Total magnetic field strength.
        bz_gsm_nt:
          type: number
          format: double
          description: North-south field component (GSM); sustained negative values
            drive storms.
        bz_gsm_nt_min:
          type: number
          format: double
          description: "Hourly only: the most southward minute."
        density_cm3:
          type: number
          format: double
          description: Proton density.
        observed_at:
          type: string
          format: date-time
        samples:
          type: integer
          format: int32
          description: "Hourly only: minutes averaged."
        speed_kms:
          type: number
          format: double
          description: Bulk speed.
        speed_kms_max:
          type: number
          format: double
          description: "Hourly only: the fastest minute."
        temperature_k:
          type: number
          format: double
      required:
      - observed_at
    SourceQuality:
      type: object
      description: Open data-quality problems attributed to this source.
      properties:
        blocking:
          type: integer
          format: int64
          description: Problems that fail the strict data-quality check.
        level:
          $ref: "#/components/schemas/Term"
          description: "ok, warning or blocking."
        warnings:
          type: integer
          format: int64
          description: Gaps such as names without a Japanese translation.
      required:
      - blocking
      - level
      - warnings
    SourceStatus:
      type: object
      description: The latest ingestion run and fetch for this source.
      properties:
        freshness:
          $ref: "#/components/schemas/Term"
          description: "fresh, stale (no fetch within twice the interval), unknown\
            \ or on_demand."
        last_fetched_at:
          type: string
          format: date-time
          description: "The most recent request to the source, including 304 Not Modified."
        last_run:
          $ref: "#/components/schemas/Term"
          description: Status of the most recent ingestion run.
        last_run_finished_at:
          type: string
          format: date-time
        last_run_started_at:
          type: string
          format: date-time
        last_succeeded_at:
          type: string
          format: date-time
      required:
      - freshness
    SourceView:
      type: object
      description: "A data source with its credit, license, update cadence, freshness\
        \ and data-quality status."
      properties:
        cadence:
          type: string
          description: How often Hoshizora refreshes the source.
        credit:
          type: string
          description: Credit text to show wherever this source's data appears.
        description:
          type: string
          description: What the source provides.
        homepage_url:
          type: string
        license:
          type: string
          description: "The source's license or usage terms, summarized."
        license_url:
          type: string
        name:
          type: string
        quality:
          $ref: "#/components/schemas/SourceQuality"
        slug:
          type: string
          description: Stable source identifier.
          example: swpc
        status:
          $ref: "#/components/schemas/SourceStatus"
        update_interval_seconds:
          type: integer
          format: int64
          description: Planned refresh interval; null when the source changes only
            on demand.
      required:
      - cadence
      - credit
      - description
      - homepage_url
      - license
      - name
      - quality
      - slug
      - status
    SpaceWeatherNow:
      type: object
      description: "Current space weather: the latest Kp, solar wind and the strongest\
        \ flare of the past day."
      properties:
        as_of:
          type: string
          format: date-time
          description: Conditions are taken at or before this hour boundary.
        flares_last_day:
          type: integer
          format: int64
          description: Flares in the 24 hours before as_of.
        kp:
          $ref: "#/components/schemas/KpReading"
        solar_wind:
          $ref: "#/components/schemas/SolarWindPoint"
        strongest_flare_last_day:
          $ref: "#/components/schemas/Flare"
          description: The strongest classified flare in the 24 hours before as_of.
      required:
      - as_of
      - flares_last_day
    Term:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        name_lang:
          type: string
          enum:
          - en
          - ja
      required:
      - code
      - name
      - name_lang
    TimeUncertainty:
      type: object
      description: 3-sigma uncertainty in the approach time.
      properties:
        less_than:
          type: boolean
          description: "True when JPL states only an upper bound, e.g. under one minute."
        minutes:
          type: number
          format: double
      required:
      - less_than
      - minutes
