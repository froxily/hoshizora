openapi: 3.1.0
info:
  description: "Read-only space data analytics in English and Japanese. Localized\
    \ text follows Accept-Language (en or ja), and each localized field has a sibling\
    \ *_lang field naming the language actually returned, because some names exist\
    \ only in English."
  title: Hoshizora API
  version: v1
servers:
- url: /
tags:
- description: "Geomagnetic activity, solar flares, solar wind and the aurora forecast,\
    \ from NOAA SWPC."
  name: Space weather
- description: "Asteroid and comet close approaches and Sentry impact monitoring,\
    \ from JPL."
  name: Near-Earth
- description: "Sources, credits and data freshness."
  name: Meta
- description: "Every orbital launch attempt and planned launch, from Launch Library\
    \ 2."
  name: Launches
- description: "Aggregates from the analytics marts, each linking to the records behind\
    \ it."
  name: Statistics
- description: Confirmed exoplanets from the NASA Exoplanet Archive.
  name: Exoplanets
- description: "Space agencies, launch companies, armed forces and international bodies,\
    \ as one model."
  name: Agencies
- description: "Data-driven fun facts in English and Japanese, each traced to its\
    \ records."
  name: Facts
paths:
  /api/v1/agencies:
    get:
      description: "Organizations from Launch Library 2 and the curated reference\
        \ data, with their countries, national programs and launch totals as provider.\
        \ A launch provider is not necessarily an agency: Chinese launches are mostly\
        \ attributed to CASC, a state company."
      operationId: listAgencies
      parameters:
      - description: Only organizations of this type.
        in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - agency
          - company
          - military
          - academic
          - international
      - description: "ISO 3166-1 alpha-2 country, e.g. JP."
        in: query
        name: country
        required: false
        schema:
          type: string
          pattern: "[A-Za-z]{2}"
      - description: "National program slug, e.g. japan."
        in: query
        name: program
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - description: "true for launch providers only, false for organizations that\
          \ never launched."
        in: query
        name: has_launches
        required: false
        schema:
          type: boolean
      - description: Text to find in the English or Japanese name or the abbreviation.
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 1
      - description: "-launches for most launches first, name for alphabetical."
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: -launches
          enum:
          - -launches
          - name
      - description: 1-based page number.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - description: "Items per page, at most 100."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          content:
            application/json:
              examples:
                seed:
                  value:
                    items:
                    - key: mhi
                      name: Mitsubishi Heavy Industries
                      name_lang: en
                      abbrev: MHI
                      type:
                        code: company
                        name: Company
                        name_lang: en
                      countries:
                      - code: JP
                        name: Japan
                      programs:
                      - slug: japan
                        name: Japan
                      founding_year: 1884
                      launches:
                        attempts: 9
                        successes: 9
                        failures: 0
                        partial_failures: 0
                        scheduled: 0
                        success_rate: 1.0
                        first_launch_at: 2016-11-02T06:20:00Z
                        last_launch_at: 2021-12-22T15:32:00Z
                    - key: arianespace
                      name: Arianespace
                      name_lang: en
                      abbrev: ASA
                      type:
                        code: company
                        name: Company
                        name_lang: en
                      countries:
                      - code: FR
                        name: France
                      programs:
                      - slug: europe
                        name: Europe
                      founding_year: 1980
                      launches:
                        attempts: 4
                        successes: 3
                        failures: 0
                        partial_failures: 1
                        scheduled: 1
                        success_rate: 0.75
                        first_launch_at: 2018-01-25T22:20:00Z
                        last_launch_at: 2021-11-16T09:27:55Z
                    page: 1
                    size: 2
                    total_items: 15
                    total_pages: 8
              schema:
                $ref: "#/components/schemas/PageAgencySummary"
          description: OK
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: List organizations
      tags:
      - Agencies
  /api/v1/agencies/{key}:
