spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:hoshizora_api}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 20000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

hoshizora:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
